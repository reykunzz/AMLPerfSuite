name: Build AMLPerfSuite

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ambil header AndroidModLoader
        run: |
          bash ./setup-aml-headers.sh
          echo "--- isi folder mod/ dari AML ---"
          ls -la third_party/AndroidModLoader/mod 2>/dev/null || ls -la include/mod 2>/dev/null || true

      - name: Build dengan ndk-build (armeabi-v7a + arm64-v8a)
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT:-}}}"
          if [ -z "$NDK" ] || [ ! -x "$NDK/ndk-build" ]; then
            echo "NDK tidak ditemukan di runner" >&2
            exit 1
          fi
          echo "Memakai NDK: $NDK"
          "$NDK/ndk-build" \
            NDK_PROJECT_PATH="$PWD" \
            APP_BUILD_SCRIPT="$PWD/Android.mk" \
            NDK_APPLICATION_MK="$PWD/Application.mk" \
            AML_ROOT="$PWD/third_party/AndroidModLoader" \
            -j"$(nproc)"

      - name: Susun paket
        run: |
          mkdir -p dist/arm64-v8a dist/armeabi-v7a
          cp libs/arm64-v8a/libAMLPerfSuite.so   dist/arm64-v8a/
          cp libs/armeabi-v7a/libAMLPerfSuite.so dist/armeabi-v7a/
          cp config/AMLPerfSuite.ini dist/
          cp README.md dist/
          (cd dist && zip -r ../AMLPerfSuite.zip .)

      - uses: actions/upload-artifact@v4
        with:
          name: AMLPerfSuite
          path: dist/

      - name: Rilis (hanya untuk tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: AMLPerfSuite.zip
