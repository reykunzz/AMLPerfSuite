; ============================================================
;  AML Performance Suite - konfigurasi
;  File ini dibaca ulang otomatis ~1 detik setelah disimpan.
;  Kecuali dinyatakan lain, perubahan langsung berlaku tanpa restart game.
; ============================================================

[General]
; Preset performa: Custom / Low / Medium / High / Ultra
; Custom = pakai nilai di file ini apa adanya.
Preset = Custom
; Tampilkan toast saat Low Memory Mode / preset berubah (1 = ya)
ShowToasts = 0

[Overlay]
; 0 = mati, 1 = mini (satu baris kecil), 2 = lengkap
Mode = 1
; 0 = kiri-atas, 1 = kanan-atas, 2 = kiri-bawah, 3 = kanan-bawah
Corner = 0
; Pembesaran font (1.0 = sangat kecil, 2.0 = normal, 3.0 = besar)
Scale = 2.0
Opacity = 0.85
; Jarak dari tepi layar dalam piksel (naikkan bila terpotong notch)
Margin = 24

; Baris yang ditampilkan di overlay
ShowFPS = 1
ShowFrameTime = 1
ShowRAM = 1
ShowMemoryUsage = 1
ShowDrawCalls = 1
ShowTextureMemory = 1

; Batas warna: FPS >= Good hijau, >= Warn kuning, selain itu merah
FpsGood = 28
FpsWarn = 20

[Graph]
; Grafik tampil di bawah teks pada overlay mode 2
Show = 1
; 0 = frame time (ms), 1 = FPS
Mode = 0
; Jumlah sampel (maks 240)
Samples = 120
MaxMs = 50
MaxFps = 60

[Monitors]
; Hook di libGLESv2.so. Perubahan hanya berlaku setelah game dijalankan ulang.
; Matikan salah satunya bila game crash di perangkatmu.
DrawCallMonitor = 1
TextureMemoryMonitor = 1

[Limiter]
; 0 = mati. Contoh: 30 / 40 / 45 / 60
; Catatan: limiter hanya MENURUNKAN FPS. Batas atas ditentukan game sendiri.
FpsLimit = 0
; 1 = otomatis turun/naik antar 60-45-40-30 (maksimum = FpsLimit)
Adaptive = 0

[LowMemory]
; 0 = mati, 1 = otomatis (aktif bila RAM tersedia < ThresholdMB), 2 = selalu aktif
Mode = 1
ThresholdMB = 700
; Jeda (detik) pemangkasan heap native saat mode aktif
TrimIntervalSec = 10

[GameTuning]
; OPSIONAL dan eksperimental. Preset dapat mengatur LOD distance scale game,
; tapi alamatnya berbeda tiap versi libGTASA.so. Isi salah satu:
;   - offset (hex) dari base libGTASA.so, atau
;   - nama simbol yang di-export libGTASA.so
; Selama Enabled = 0, bagian ini tidak menyentuh memori game.
Enabled = 0
LodScaleOffset32 = 0
LodScaleOffset64 = 0
LodScaleSymbol =

[Menu]
; Menu pengaturan di dalam game. Ketuk tombol MENU di layar untuk membuka.
Enabled = 1
; Posisi tombol: 0 kiri-atas, 1 kanan-atas, 2 kiri-bawah, 3 kanan-bawah, 4 tengah-atas
Button = 4
; 1 = tampilkan titik & nilai sentuhan terakhir (untuk memeriksa input)
Debug = 0
; Nilai 'type' sentuhan dari game: jari turun / naik / geser.
; Ubah bila menu tidak merespons (lihat Debug dan file AMLPerfSuite.log).
TouchDownType = 2
TouchUpType = 1
TouchMoveType = 3
; Fungsi sentuhan libGTASA.so. Kosong = coba nama bawaan. Atau isi offset (hex).
TouchSymbol =
TouchOffset32 = 0
TouchOffset64 = 0
